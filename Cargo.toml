[package]
name = "bmat"
version = "0.1.0"
edition = "2024"
description = "Bevy material bundles and an OpenRaster-to-BMAT compiler"
license = "MIT OR Apache-2.0"

[features]
default = ["converter", "editor"]
converter = ["dep:exr", "dep:glob", "dep:image", "dep:ktx2", "dep:quick-xml", "dep:zip"]
hot_reload = ["bevy/file_watcher"]
editor = ["converter", "dep:bevy_egui", "dep:tar", "dep:tempfile", "dep:rfd"]

[[bin]]
name = "ora_to_bmat"
path = "src/bin/ora_to_bmat.rs"
required-features = ["converter"]

[[bin]]
name = "edbmat"
path = "src/bin/edbmat.rs"
required-features = ["editor"]

[dependencies]
rfd = { version = "0.17.2", optional = true }
bevy = { version = "0.19.1", features = ["pbr_multi_layer_material_textures", "pbr_transmission_textures", "pbr_anisotropy_texture"] }
bevy_trenchbroom = { version = "0.14.0" }
bevy_materialize = "0.11.0"
bevy_egui = { version = "0.40.1", optional = true }
tar = { version = "0.4", optional = true }
tempfile = { version = "3", optional = true }
ron = "0.11.0"
serde = { version = "1.0", features = ["derive"] }
exr = { version = "1.74.0", optional = true }
glob = { version = "0.3.4", optional = true }
image = { version = "0.25.10", default-features = false, features = ["png"], optional = true }
ktx2 = { version = "0.5.0", optional = true }
quick-xml = { version = "0.41.0", optional = true }
zip = { version = "0.6.6", default-features = false, features = ["deflate"], optional = true }
